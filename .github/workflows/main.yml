name: Build FFGL plugin (Windows x64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Resolume FFGL SDK (pinned commit)
        shell: bash
        run: |
          git clone https://github.com/resolume/ffgl.git ffgl-sdk
          git -C ffgl-sdk checkout 5b6e07840277df9ec35a228b9eb067636316350f

      - name: Regenerate shader + parameter sources
        run: |
          python tools/gen_shader.py
          python tools/embed_panel.py

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFFGL_ROOT="${{ github.workspace }}/ffgl-sdk"

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test HTTP panel and lifecycle
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test browser communication logic
        run: node tests/test_frontend.mjs build/Release/panel_harness.exe

      - name: Verify the DLL (x64, exports plugMain)
        run: |
          pip install pefile
          python tools/check_dll.py build/Release/BackgroundGen.dll

      - uses: actions/upload-artifact@v4
        with:
          name: BackgroundGen-win64
          path: build/Release/BackgroundGen.dll
          if-no-files-found: error
